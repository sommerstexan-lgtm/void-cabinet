<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#03040c" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./common.css" />
  <title>KLONDIKE — VOID CABINET</title>
  <style>
    body { overflow-x: hidden; }
    #board {
      display: grid;
      grid-template-columns: repeat(7, minmax(72px, 1fr));
      gap: 10px;
      max-width: 980px;
      margin: 0 auto;
    }
    .pile {
      min-height: 108px;
      border: 1px dashed rgba(120,230,255,0.18);
      border-radius: 10px;
      position: relative;
    }
    .pile.over { outline: 2px solid #6cf0ff; }
    .card {
      width: 100%;
      aspect-ratio: 2.4 / 3.4;
      max-height: 148px;
      border-radius: 8px;
      border: 1px solid rgba(180,220,255,0.25);
      background: #f4f7ff;
      color: #12141c;
      position: relative;
      box-shadow: 0 6px 16px rgba(0,0,0,0.35);
      user-select: none;
      cursor: grab;
      font-weight: 700;
    }
    .card.red { color: #c6284a; }
    .card.back {
      background:
        linear-gradient(135deg, rgba(108,240,255,0.18), rgba(194,77,255,0.18)),
        #12182c;
      color: transparent;
      border-color: rgba(108,240,255,0.4);
    }
    .card .r { position: absolute; top: 6px; left: 7px; font-size: 13px; line-height: 1.1; }
    .card .s { position: absolute; bottom: 6px; right: 7px; font-size: 16px; }
    .tableau .card { position: absolute; left: 0; right: 0; }
    .waste-wrap, .stock-wrap, .found { position: relative; }
    #toprow { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(7, minmax(72px, 1fr)); gap: 10px; margin-bottom: 4px; }
    .empty-hint { opacity: 0.28; font-size: 22px; display: flex; align-items: center; justify-content: center; height: 100px; }
    #tools { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body class="cabinet-bg">
  <div class="topnav">
    <a class="back" href="./index.html">CABINET</a>
    <h1>KLONDIKE</h1>
    <div class="spacer"></div>
  </div>
  <div class="panel">
    <div class="status-row">
      <span>MOVES <strong id="moves">0</strong></span>
      <span>TIME <strong id="time">0:00</strong></span>
      <span>SCORE <strong id="score">0</strong></span>
      <div id="tools">
        <button type="button" id="undo">Undo</button>
        <button type="button" id="new">New</button>
        <button type="button" id="daily">Daily</button>
        <button type="button" id="drawMode">Draw 3</button>
      </div>
    </div>
    <div id="board"></div>
    <p class="msg" id="msg">Build A→K by suit in the foundations. Tableau stacks descend and alternate color.</p>
  </div>
  <script src="./klondike.js"></script>
  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
</body>
</html>
